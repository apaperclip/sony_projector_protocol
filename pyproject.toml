[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sony-projector-protocol"
version = "0.2.2"
authors = [
    {name = "Sony Projector Protocol Contributors"},
]
description = "Async Python control helpers for Sony projectors"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
requires-python = ">=3.11"
#dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest-cov==4.0.0",
    "pytest>=7.3.1",
    "pytest-github-actions-annotate-failures",
]

[project.urls]
Documentation = "https://github.com/sony-projector-protocol/sony-projector-protocol#readme"
Source = "https://github.com/sony-projector-protocol/sony-projector-protocol"
Tracker = "https://github.com/sony-projector-protocol/sony-projector-protocol/issues"

[tool.flit.module]
name = "sony_projector_protocol"

[tool.black]
line-length = 120

[tool.coverage.run]
branch = true

[tool.pytest.ini_options]
addopts = "--cov-report xml:coverage.xml --cov src --cov-fail-under 0 -m 'not integration'"
pythonpath = [
  "src"
]
testpaths = "tests"
junit_family = "xunit2"
markers = [
    "integration: marks as integration test",
    "slow: marks tests as slow",
    "unit: fast offline tests",
]
