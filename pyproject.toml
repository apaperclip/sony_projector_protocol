[build-system]
requires = ["flit_core >=2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "sony-projector-protocol"
version = "0.3.5"
authors = [
    {name = "Sony Projector Protocol Contributors"},
]
description = "Async Python control helpers for Sony projectors"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14.2"
#dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest-cov==7.1.0",
    "pytest>=7.3.1",
    "pytest-github-actions-annotate-failures",
]
dev = [
    "black>=24.0",
    "isort>=5.12",
    "pre-commit>=3.0",
    "pytest-cov==7.1.0",
    "pytest>=7.3.1",
    "pytest-github-actions-annotate-failures",
]

[project.urls]
Documentation = "https://github.com/apaperclip/sony_projector_protocol/blob/main/README.md"
Source = "https://github.com/apaperclip/sony_projector_protocol"
Tracker = "https://github.com/apaperclip/sony_projector_protocol/issues"

[tool.flit.module]
name = "sony_projector_protocol"

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src", "tests", "scripts"]
add_imports = ["from __future__ import annotations"]

[tool.coverage.run]
branch = true

[tool.pytest.ini_options]
addopts = "--cov-report xml:coverage.xml --cov src --cov-fail-under 0 -m 'not integration'"
pythonpath = [
  "src"
]
testpaths = "tests"
junit_family = "xunit2"
markers = [
    "integration: marks as integration test",
    "slow: marks tests as slow",
    "unit: fast offline tests",
]
[tool.flit.sdist]
exclude = [
    ".github/**",
    ".devcontainer/**",
    ".vscode/**",
    ".pypirc",
    "**/*.bak",
]
